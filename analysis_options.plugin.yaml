include: analysis_options.yaml

# Turns on the alloy_lint plugin, which is off by default.
#
# Copy this over `analysis_options.yaml` when you want the rules in your
# editor, and do not commit the result. It is separate for a reason that goes
# away with publication: the analysis server materialises a plugin by writing a
# synthetic `plugin_entrypoint` package and resolving it **against pub.dev**.
# Two things are outside this repository's control there.
#
# Our own packages are not published, so the resolution cannot find them — that
# is what the `dependency_overrides` below are for, and why a consumer would
# write only the `plugins` entry.
#
# The constraint on `analysis_server_plugin` itself comes from the SDK, not
# from us. An SDK that vendors an unpublished version asks for something like
# `^0.3.21-dev`, pub.dev has no such version, and analysis fails before a
# single file is read. That is not a failure of the code being analysed, which
# is why it must not gate a build.
#
# After publication both problems are gone: this file's contents become three
# lines in `analysis_options.yaml` and this one is deleted.
plugins:
  alloy_lint:
    path: packages/alloy_lint
  dependency_overrides:
    alloy_lint:
      path: packages/alloy_lint
    alloy_analyzer:
      path: packages/alloy_analyzer
    alloy:
      path: packages/alloy
    alloy_annotations:
      path: packages/alloy_annotations
