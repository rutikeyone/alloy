include: package:lints/recommended.yaml

# The alloy_lint plugin is enabled from `analysis_options.plugin.yaml`, not
# from here. Naming it in this file makes every `dart analyze` in the
# repository resolve a synthetic package against pub.dev, which fails on any
# SDK whose bundled `analysis_server_plugin` is not published yet — CI met
# exactly that. See that file for how to turn it on.

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - unawaited_futures
