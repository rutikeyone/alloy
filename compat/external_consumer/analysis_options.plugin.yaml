include: analysis_options.yaml

# Turns on the cobalt_lint plugin for the stand, which is off by default.
#
# Copy this over `analysis_options.yaml` when you want to check that the plugin
# loads from outside the workspace — the one thing this stand exists to prove
# that the workspace cannot. See the root `analysis_options.plugin.yaml` for
# why it is not on by default.
#
# A published cobalt_lint needs only the `plugins` entry. The overrides are
# scaffolding for the unpublished state, not something a consumer writes.
plugins:
  cobalt_lint:
    path: ../../packages/cobalt_lint
  dependency_overrides:
    cobalt_lint:
      path: ../../packages/cobalt_lint
    cobalt_analyzer:
      path: ../../packages/cobalt_analyzer
    cobalt:
      path: ../../packages/cobalt
    cobalt_annotations:
      path: ../../packages/cobalt_annotations
