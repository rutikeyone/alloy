builders:
  cobalt_property_injection:
    import: "package:cobalt_generator/builder.dart"
    builder_factories: ["cobaltPropertyInjectionBuilder"]
    build_extensions: { ".dart": [".cobalt.g.part"] }
    auto_apply: dependents
    build_to: cache
    applies_builders: ["source_gen|combining_builder"]
    defaults:
      generate_for:
        - lib/**
  cobalt_scan:
    import: "package:cobalt_generator/builder.dart"
    builder_factories: ["cobaltScanBuilder"]
    build_extensions: { ".dart": [".cobalt.json"] }
    auto_apply: dependents
    build_to: cache
    runs_before: ["cobalt_generator|cobalt_container"]
    defaults:
      generate_for:
        - lib/**
  cobalt_container:
    import: "package:cobalt_generator/builder.dart"
    builder_factories: ["cobaltContainerBuilder"]
    build_extensions: { "$lib$": ["cobalt.g.dart"] }
    auto_apply: dependents
    build_to: source
