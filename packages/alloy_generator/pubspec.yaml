name: alloy_generator
description: Code generator for Alloy. Emits the container, property-injection mixins and the two-phase startup. Use as a dev_dependency.
version: 0.1.0
repository: https://github.com/rutikeyone/alloy
issue_tracker: https://github.com/rutikeyone/alloy/issues
topics:
  - dependency-injection
  - codegen
  - build-runner
  - di

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  alloy_analyzer: ^0.1.0
  alloy_annotations: ^0.1.0
  analyzer: ">=12.1.0 <15.0.0"
  build: ^4.0.4
  code_builder: ^4.11.0
  collection: ^1.19.0
  dart_style: ">=3.1.6 <3.1.10"
  glob: ^2.1.3
  path: ^1.9.0
  source_gen: ^4.2.0

dev_dependencies:
  build_runner: ^2.15.0
  build_test: ^3.5.4
  logging: ^1.3.0
  package_config: ^2.1.0
  test: ^1.25.0
