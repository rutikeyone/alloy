name: alloy_analyzer
description: Shared static analysis layer for Alloy. Parses Alloy annotations once for both the generator and the lint plugin.
version: 0.1.0
repository: https://github.com/rutikeyone/alloy
issue_tracker: https://github.com/rutikeyone/alloy/issues
topics:
  - dependency-injection
  - analyzer
  - codegen
  - static-analysis

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  alloy: ^0.1.0
  alloy_annotations: ^0.1.0
  analyzer: ">=10.0.0 <15.0.0"
  collection: ^1.19.0
  meta: ^1.16.0
  path: ^1.9.0

dev_dependencies:
  build: ^4.0.4
  build_test: ^3.5.4
  test: ^1.25.0
