name: alloy_talker_flutter
description: Dresses talker's log screen in the same palette as the Alloy inspector, so the graph's events and its log read as one tool inside your app.
version: 0.1.0
repository: https://github.com/rutikeyone/alloy
issue_tracker: https://github.com/rutikeyone/alloy/issues
topics:
  - dependency-injection
  - logging
  - devtools
  - debugging

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  alloy_inspector: ^0.1.0
  alloy_talker: ^0.1.0
  flutter:
    sdk: flutter
  talker_flutter: ^5.1.0

dev_dependencies:
  alloy: ^0.1.0
  alloy_test: ^0.1.0
  talker: ^5.1.0
  flutter_test:
    sdk: flutter
