name: alloy_inspector
description: In-app inspector for Alloy — the live scope tree, what was built and with what lifetime, and the event log, on a screen inside your app.
version: 0.1.0
repository: https://github.com/rutikeyone/alloy
issue_tracker: https://github.com/rutikeyone/alloy/issues
topics:
  - dependency-injection
  - di
  - devtools
  - debugging

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  alloy_flutter: ^0.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
