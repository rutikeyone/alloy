name: alloy_bloc
description: Lets an Alloy scope close the blocs it built — a mixin that bridges bloc's close() to Alloy's AsyncDisposable, and the function to name where a mixin will not reach.
version: 0.1.0
repository: https://github.com/rutikeyone/alloy
issue_tracker: https://github.com/rutikeyone/alloy/issues
topics:
  - dependency-injection
  - di
  - bloc
  - state-management

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  alloy: ^0.1.0
  bloc: ^9.0.0

dev_dependencies:
  alloy_test: ^0.1.0
  test: ^1.25.0
