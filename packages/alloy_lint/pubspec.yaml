name: alloy_lint
description: Analyzer plugin with lint rules for Alloy. Catches invalid annotations in the IDE instead of at build time.
version: 0.1.0
repository: https://github.com/rutikeyone/alloy
issue_tracker: https://github.com/rutikeyone/alloy/issues
topics:
  - dependency-injection
  - lints
  - analyzer-plugin
  - di

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  alloy_analyzer: ^0.1.0
  analysis_server_plugin: ^0.3.0
  analyzer: ">=10.0.0 <15.0.0"
  analyzer_plugin: ^0.14.0

dev_dependencies:
  analyzer_testing: ">=0.3.0 <0.4.0"
  test: ^1.25.0
  test_reflective_loader: ^0.4.0
