name: alloy_go_router
description: go_router bindings for Alloy — dependency scopes whose lifetime is a navigation flow, created on entry and disposed on exit.
version: 0.1.0
repository: https://github.com/rutikeyone/alloy
issue_tracker: https://github.com/rutikeyone/alloy/issues
topics:
  - dependency-injection
  - di
  - go-router
  - navigation

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  alloy_flutter: ^0.1.0
  flutter:
    sdk: flutter
  go_router: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
