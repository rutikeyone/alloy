name: flow_scopes
description: Alloy example — a navigation flow that owns its dependencies, wired with go_router.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.38.0"

resolution: workspace

dependencies:
  alloy_go_router: ^0.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  go_router: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
