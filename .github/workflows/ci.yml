name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Two channels, not two Flutter versions: every package needs Dart ^3.13,
    # which no Flutter below 3.47 ships, so there is no older version to test
    # against. beta is the useful axis — it finds breakage before it lands.
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    continue-on-error: ${{ matrix.channel == 'beta' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}

      - name: Resolve workspace
        run: flutter pub get

      # Not a workspace member on purpose — it resolves standalone, the way a
      # third-party project does. Must run before `dart analyze .`, which would
      # otherwise hit an unresolved analysis context.
      - name: Resolve external consumer
        run: dart pub get
        working-directory: compat/external_consumer

      # Existence only. Whether a translation still says what the English says
      # is not checkable by machine — that is a line in the RELEASING checklist.
      - name: Translations are present
        run: |
          for f in README.ru.md README.zh-CN.md \
                   GUIDE_MANUAL.md GUIDE_MANUAL.ru.md GUIDE_MANUAL.zh-CN.md \
                   GUIDE_CODEGEN.md GUIDE_CODEGEN.ru.md GUIDE_CODEGEN.zh-CN.md \
                   MIGRATION.md MIGRATION.ru.md MIGRATION.zh-CN.md; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done

      - name: Analyze
        run: dart analyze --fatal-infos .

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify generated code is current
        run: |
          for package in examples/codegen_basics examples/notes_app \
                         compat/external_consumer; do
            (cd "$package" && dart run build_runner build)
          done
          for package in packages/alloy_inspector examples/gallery \
                         examples/notes_app examples/flow_scopes \
                         examples/graph_events examples/codegen_basics; do
            (cd "$package" && flutter gen-l10n)
          done
          git diff --exit-code

      - name: Test pure Dart packages
        run: |
          for package in packages/alloy packages/alloy_analyzer \
                         packages/alloy_generator packages/alloy_lint \
                         packages/alloy_talker packages/alloy_logging \
                         packages/alloy_logger packages/alloy_test \
                         packages/alloy_bloc \
                         examples/manual_mode examples/teardown \
                         compat/external_consumer; do
            (cd "$package" && dart test)
          done

      - name: Test Flutter packages
        run: |
          for package in packages/alloy_flutter packages/alloy_go_router \
                         packages/alloy_inspector \
                         packages/alloy_talker_flutter \
                         packages/alloy_test_flutter \
                         examples/codegen_basics examples/notes_app \
                         examples/flow_scopes examples/graph_events \
                         examples/testing_patterns examples/gallery; do
            (cd "$package" && flutter test)
          done

      - name: Coverage
        if: matrix.channel == 'stable'
        run: |
          dart pub global activate coverage
          ./tool/coverage.sh

      - name: Publish dry run
        run: |
          for package in packages/alloy_annotations packages/alloy \
                         packages/alloy_analyzer packages/alloy_generator \
                         packages/alloy_test packages/alloy_talker \
                         packages/alloy_bloc \
                         packages/alloy_logging packages/alloy_logger \
                         packages/alloy_flutter packages/alloy_go_router \
                         packages/alloy_inspector \
                         packages/alloy_talker_flutter \
                         packages/alloy_test_flutter; do
            (cd "$package" && dart pub publish --dry-run)
          done

      # alloy_lint cannot go in the loop above: pub exits non-zero because of
      # the lib/main.dart warning the analysis-server plugin API requires, and
      # which riverpod_lint carries too. Asserting the count instead still
      # fails the build if a second warning ever appears.
      - name: Publish dry run for alloy_lint
        run: |
          cd packages/alloy_lint
          dart pub publish --dry-run 2>&1 | tee /tmp/lint-dry-run.txt || true
          grep -q 'Package has 1 warning' /tmp/lint-dry-run.txt
